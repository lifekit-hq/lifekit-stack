# modules.yaml — lifekit-stack routing manifest
#
# Describes each capability module wired in this stack.
# OpenClaw reads this (via lifekit-router skill) to route user intents
# to the right MCP server.
#
# Deploy: scripts/deploy.sh copies this to /srv/life/system/modules.yaml
# on the VPS so it lands in the ~/.life/ knowledge layer where OpenClaw
# can read it.
#
# Schema:
#   id          — matches the MCP server id in openclaw.json
#   description — what this module can do (used for routing decisions)
#   mcp         — internal MCP server URL (compose DNS)
#   examples    — sample intents that should route here

modules:
  - id: google-workspace
    description: Send and read emails, manage calendar events, create and edit Google Docs, Sheets, Drive files, manage tasks
    mcp: http://google-workspace-mcp:8000/mcp/
    examples:
      - "send an email to John about the meeting"
      - "what's on my calendar tomorrow"
      - "book a dentist appointment"
      - "create a Google Doc with my weekly plan"
      - "add a task to my Google Tasks"

  - id: health-claw
    description: >-
      Log workouts, track PRs and volume per muscle group, record daily
      mood/energy/soreness/sleep, get state-aware fitness suggestions
    mcp: http://health-claw:8000/mcp/
    examples:
      - "log today's workout: bench 4x10 at 60, pullups 4x10"
      - "what's my squat PR"
      - "how much back volume did I do this week"
      - "feeling tired, energy 5, sore chest"
      - "morning check-in: slept well, energy 7"
      - "what was my last workout"
      - "show my chest history from the last month"

  # ── future modules ────────────────────────────────────────────────────────
