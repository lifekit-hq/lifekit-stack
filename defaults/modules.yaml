# modules.yaml — lifekit-stack routing manifest
#
# Describes each MCP module wired in this stack: exactly the servers the live
# gateway lists under `openclaw mcp list`. OpenClaw reads this (via the
# lifekit-router skill) to route user intents to the right MCP server.
#
# Health is not a module here: food and workouts run as Kit's workspace
# skills (workout-claw, life-state), called as bash by the Kit agent. The
# health-claw MCP wrapper was removed in the v2 cutover, so nothing below
# points at it.
#
# Deploy: the OpenClaw "modules" phase of scripts/deploy-openclaw.sh copies
# this to /srv/memory/system/modules.yaml on the VPS (the vault) so OpenClaw
# can read it.
#
# Schema:
#   id          — matches the MCP server id in openclaw.json (`openclaw mcp list`)
#   description — what this module can do (used for routing decisions)
#   mcp         — internal MCP server URL (compose DNS)
#   examples    — sample intents that should route here

modules:
  - id: google-workspace
    description: Send and read emails, manage calendar events, create and edit Google Docs, Sheets, Drive files, manage tasks
    mcp: http://google-workspace-mcp:8000/mcp/
    examples:
      - "send an email to John about the meeting"
      - "what's on my calendar tomorrow"
      - "book a dentist appointment"
      - "create a Google Doc with my weekly plan"
      - "add a task to my Google Tasks"

  - id: finance-sentry
    description: >-
      Read the owner's investing and finance data: portfolio, recommendations
      and their verdicts, watchlist, pending companion events. Ledger (agent id
      `finance`) is the agent that uses it
    mcp: http://finance-sentry-mcp:5100/
    examples:
      - "how is my portfolio doing against the plan"
      - "what recommendations are waiting on me"
      - "what is on my watchlist"

  # ── future modules ────────────────────────────────────────────────────────
  # Add an entry only when its MCP server is registered in openclaw.json.
