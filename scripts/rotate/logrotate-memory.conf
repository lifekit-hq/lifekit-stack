# Memory rotation — Phase 1 staged logrotate config (2026-05-29)
#
# The append-only .jsonl targets below are CREATED BY Phase 2 (scrape-curate /
# scout-claw) and do not exist yet. `missingok` makes this a safe no-op until
# then — the rotation CONTRACT exists before the data accumulates, per
# proposals.md#2026-05-28-rotation-and-retention-shared-infra (config-now,
# not migration-later).
#
# Deferred (parked proposals — add their globs when unparked):
#   /srv/openclaw/config/agents/*/workspace/pursuit/log.jsonl   (goal-pursuit)
#   /srv/memory/self/mood-log.jsonl                               (self-model)
#
# NOT handled here (wrong tool — these are DIRS of many ephemeral UUID-named files,
# not single append-only logs):
#   - OpenClaw isolated cron/heartbeat run sessions -> bounded natively by
#     `cron.sessionRetention` (default 24h) in openclaw.json.
#   - `*/sessions/*.trajectory.jsonl` (completed-run audit traces) -> gzipped/pruned
#     by rotate-state.py (--agents-dir); conversation session sizes are reported
#     each run so growth stays visible.
#
# Invocation: memory-rotate.sh (this dir) runs
#   /usr/sbin/logrotate --state /var/lib/lifekit/rotation/logrotate.state \
#                       /srv/lifekit-stack/scripts/rotate/logrotate-memory.conf
# NOT the root /etc/cron.daily/logrotate path — kept user-land with a private
# --state file so it stays VPS-memory-scoped and re-runnable. This conf lives in
# the lifekit-stack repo (scripts/rotate/), evicted from the vault 2026-07-15.
#
# copytruncate: the in-container scout writer keeps the same fd; truncate-in-place
# is safe and avoids a missed-write window. delaycompress pairs with it (don't
# gzip a file that may have been mid-write during the copy).

/srv/memory/system/scout_log.jsonl
/srv/openclaw/config/agents/*/workspace/scout/rejected.jsonl
/srv/openclaw/config/agents/*/workspace/scout/source-health.jsonl
/var/lib/lifekit/rotation/run-log.jsonl
{
    monthly
    rotate 12
    compress
    delaycompress
    dateext
    dateformat -%Y-%m
    missingok
    notifempty
    copytruncate
}
