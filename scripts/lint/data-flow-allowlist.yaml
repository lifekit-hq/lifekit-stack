# Known gaps the data-flow lint (data-flow.py) accepts until their removal date.
# Nothing here is accepted silently: the gate prints every entry on every run, flags
# an expired one, and says when an entry is no longer needed. Each entry goes once
# its store gets a row in `## Data flow` (system/system-map.md, dsdevq/memory), the
# store is retired, or the unit sets ProtectSystem=strict plus ReadWritePaths= or
# StateDirectory=. A new store or unit never goes here: give it a row or a sandbox.

stores:
  - store: bind:/home/lifekit/.claude
    reason: the gateway's Claude Code home (session state); needs a row
    remove_by: 2027-02-26
  - store: bind:/home/lifekit/.claude.json
    reason: the gateway's Claude Code settings file; needs a row
    remove_by: 2027-02-26
  - store: bind:/home/lifekit/.config/gh
    reason: the gateway's gh CLI config; needs a row, or a secrets exclusion if it only holds the token
    remove_by: 2027-02-26
  - store: bind:/srv/openclaw/config/agents/learnclaw/workspace/learnharness-mirror
    reason: row learnharness-mirror exists but names a relative path; the row needs the absolute host path
    remove_by: 2027-02-26
  - store: bind:/srv/openclaw/workspace
    reason: the shared OpenClaw workspace; needs a row
    remove_by: 2027-02-26
  - store: bind:/var/lib/lifekit/morning-brief
    reason: legacy store (no writer since 2026-09-14); retire it and drop it from install-memory-rotate.sh
    remove_by: 2027-02-26
  - store: volume:compose_otel_filelog_state
    reason: otel-collector filelog offsets; needs a row (observability)
    remove_by: 2027-02-26
  - store: volume:compose_people-state
    reason: people-serve state; needs a row
    remove_by: 2027-02-26
  - store: volume:study-door_study-door-spool
    reason: study-door is defined but not deployed; a row once it deploys, or retire the compose file
    remove_by: 2027-02-26
  - store: volume:wger_media
    reason: wger uploaded media; the wger row names only the database
    remove_by: 2027-02-26
  - store: volume:wger_static
    reason: wger collected static files; a row, or a cache exclusion
    remove_by: 2027-02-26

