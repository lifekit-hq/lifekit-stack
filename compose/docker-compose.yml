# lifekit-stack compose file.
#
# Services:
#   (openclaw-gateway, openclaw-cli and google-workspace-mcp run in their OWN
#    compose project `openclaw` now — compose/openclaw/docker-compose.yml;
#    lifekit-vps initiative 1.2 step 4.)
#   (lifekit-dashboard runs in its OWN compose project now — deployed from
#    lifekit-hq/lifekit-dashboard's deploy/; ecosystem decoupling slice 2.)
#   (devclaw-mcp runs in devclaw's OWN compose project now — devclaw spec 005;
#    reached over the external `lifekit-shared` network. The ops-agent it used
#    to run was retired 2026-09-06.)
#   loki / prometheus / grafana — the box's observability stack (moved here
#    from finance-sentry 2026-09-06): scrapes finance-sentry, devclaw and the
#    gateway's diagnostics exporter, holds the dead-man alert rules, pings
#    Telegram directly. Loopback-bound.
#   otel-collector / tempo — OTLP trace receiver (#144): apps export traces to
#    the collector, which fans them into Tempo; Grafana links trace <-> log via
#    the Tempo/Loki datasource wiring. No host ports — reached in-network only.
#   node-exporter         — host metrics (root fs free space today); read-only root
#    mount, loopback-bound, scraped by prometheus alongside the other targets.
#   notify-relay         — the one renderer of owner notifications: a JSON envelope on
#    /notify (docs/message-format.md), or devclaw's legacy /devclaw + /text POSTs,
#    becomes Telegram HTML sent via the Bot API. Internal-only on :8090.
#
# Run from the repo root after `scripts/bootstrap-vps.sh` has set up the host:
#   cd /srv/lifekit-stack && ./scripts/deploy.sh
#
# Or directly:
#   docker compose -f compose/docker-compose.yml --env-file /srv/lifekit-secrets/stack.env up -d --build
#
# AD-HOC COMMANDS (recreate one service, rebuild one image, etc.) MUST also
# pass --env-file /srv/lifekit-secrets/stack.env, OR pre-source it:
#   set -a; source /srv/lifekit-secrets/stack.env; set +a
#   docker compose up -d <service>
# Without one of these, ${OPENCLAW_GATEWAY_TOKEN}, ${TELEGRAM_BOT_TOKEN}, and
# friends substitute to empty strings, and the services that read them (notify-relay,
# prometheus, grafana) start without their credentials.
# scripts/deploy.sh handles this for you. Bypassing the script = remember the
# flag.
#
# Uniform service policy (log rotation 50MB×3, restart on-failure:5, per-service
# memory cap, every capability dropped, no-new-privileges) is defined in the
# x-policy anchor below and merged into every long-lived service via
# `<<: *policy`. Individual services override the memory cap in their own
# `deploy.resources.limits.memory` block where needed. No service here needs a
# capability back: each runs as its image's non-root user (otel-collector is
# the one root process, see its block). Each service sets its own process cap
# (deploy.resources.limits.pids, next to its memory cap) and a read-only root
# (read_only, plus a /tmp tmpfs as scratch space for loki, tempo and grafana):
# every service here but prometheus (see its block).
---
x-policy:
  policy: &policy
    init: true
    restart: on-failure:5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

services:

  # openclaw-gateway, openclaw-cli and google-workspace-mcp moved to their own
  # compose project on 2026-09-30: compose/openclaw/docker-compose.yml, run as
  # `-p openclaw` (lifekit-vps initiative 1.2 step 4). scripts/deploy.sh brings
  # that project up after this one; Prometheus still scrapes the gateway over
  # the external lifekit-shared network.

  # lifekit-dashboard was removed here on 2026-08-16: the dashboard deploys
  # from its own repo now (lifekit-hq/lifekit-dashboard deploy/ — ecosystem
  # decoupling slice 2). It runs as its own `dashboard` compose project with
  # its own ghcr image, env file (/srv/dashboard/.env) and workflow_dispatch
  # deploy; the 5-minute redeploy timer this repo used to install is retired.

  # devclaw-mcp and devclaw-sandbox were removed here on 2026-08-15: devclaw is
  # deployed from its own repo now (devclaw spec 005) as its own compose
  # project; the two projects integrate at runtime via the external
  # `lifekit-shared` network. The ops-agent (built here, run there) was retired
  # on 2026-09-06 — the dead-man watch is the observability stack below.

  # ── Observability (box-level, moved here from finance-sentry 2026-09-06) ────
  # Grafana + Prometheus + Loki are box infrastructure, not one product's:
  # Prometheus scrapes finance-sentry's API AND devclaw-mcp (/metrics — the dead-man
  # signal), Loki takes finance-sentry's logs, Grafana holds the dashboards and
  # the alert rules that ping Telegram directly (no notify-relay in the path,
  # so a dead relay cannot swallow the alarm). Loopback-bound; Grafana is
  # fronted by Tailscale Serve on :3000. Data volumes are EXTERNAL so the
  # history finance-sentry's project accumulated survives the move (names
  # below default to that project's volume names; override in .env).
  # Dashboards stay in each product repo: finance-sentry's deploy copies its
  # JSON into ${LIFEKIT_FINANCE_SENTRY_DASHBOARDS} and Grafana loads that dir
  # as a second provider — one home per dashboard, no cross-repo copy.
  loki:
    <<: *policy
    image: grafana/loki:3.1.1
    labels:
      lifekit.contract: "none"  # platform component, not a product (scripts/platform-contract.py)
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 512
    networks:
      - default
      - lifekit-shared

  prometheus:
    <<: *policy
    image: prom/prometheus:v2.54.1
    labels:
      lifekit.contract: "none"  # platform component, not a product (scripts/platform-contract.py)
    command:
      - --config.file=/etc/prometheus/lifekit/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      # The directory, not the file: git replaces prometheus.yml with a new
      # inode on deploy, and a single-file bind mount keeps serving the old
      # one - deploy.sh's SIGHUP reload would re-read the stale config.
      - ./observability/prometheus:/etc/prometheus/lifekit:ro
      - prometheus_data:/prometheus
    # The gateway's operator token, for the `openclaw` scrape job
    # (/api/diagnostics/prometheus needs operator.read). Compose writes it
    # from the env file into /run/secrets at create time: no token file on
    # the host, nothing in git. Rotating the token = recreate prometheus.
    # No read_only: compose copies this environment-sourced secret into the
    # container filesystem at create time, which a read-only root refuses.
    secrets:
      - openclaw_gateway_token
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 512
    networks:
      - default
      - lifekit-shared

  node-exporter:
    <<: *policy
    # Host metrics - the box has none today (2026-09-15: root fs hit 85% used
    # unnoticed, no node_filesystem_* series existed to alert on it). Root fs
    # mounted read-only for filesystem stats only; --collector.disable-defaults
    # + enabling just `filesystem`, `meminfo`, `loadavg` and `pressure` keeps
    # this narrow, matching container-exporter's narrow-scope shape. `pressure`
    # is PSI: CPU, memory and IO stall recorded separately, since load average
    # conflates CPU and IO wait (record only, no alert yet). Loopback-bound, no
    # --net=host: the filesystem collector reads its own /proc/self/mountinfo,
    # which does not require host PID/network namespaces.
    image: prom/node-exporter:v1.8.2
    labels:
      lifekit.contract: "none"  # platform component, not a product (scripts/platform-contract.py)
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.meminfo
      - --collector.loadavg
      - --collector.pressure
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/storage/.+|host/(dev|proc|sys|run))($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tmpfs|tracefs)$
      # Textfile collector: host timers drop *.prom files here (the gauges
      # under scripts/quota-gauge, scripts/tmp-gauge, scripts/host-gauge and scripts/unit-gauge;
      # README "node-exporter" row lists what each writes). bootstrap-vps.sh creates the host directory
      # owned by the admin account; a missing directory is created root-owned
      # by Docker and the gauge cannot write to it.
      - --collector.textfile
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile:/textfile:ro
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"
    read_only: true
    deploy:
      resources:
        limits:
          memory: 64m
          pids: 128
    networks:
      - default

  otel-collector:
    <<: *policy
    # OTLP fan-in for the box: apps export traces to one place, we decide
    # sampling/batching/where they go without touching every app. finance-sentry
    # exports OTLP/HTTP here already (finance-sentry PR 628). Same cross-project
    # seam as loki/prometheus: default for in-project DNS (-> tempo), lifekit-shared
    # so finance-sentry-api (compose_default there) and devclaw-mcp (lifekit-shared)
    # can both reach us. No hot reload -> config mounted as a directory, same as
    # prometheus; a config change means a recreate.
    image: otel/opentelemetry-collector-contrib:0.110.0
    labels:
      lifekit.contract: "none"  # platform component, not a product (scripts/platform-contract.py)
    command:
      - --config=/etc/otel/otel-collector-config.yml
    # Also tails every container's json-file log into Loki (filelog/docker in
    # the config). Those files are root:root 0640 in 0710 dirs, hence root, but
    # with every capability dropped and a read-only rootfs; the log dir is
    # mounted read-only and offsets live in a named volume.
    user: "0:0"
    volumes:
      - ./observability/otel-collector:/etc/otel:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otel_filelog_state:/var/lib/otelcol/file_storage
    read_only: true
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 256
    expose:
      - "4317"
      - "4318"
      - "8888"
    depends_on:
      - tempo
      - loki
    networks:
      - default
      - lifekit-shared

  tempo:
    <<: *policy
    # Trace storage, local backend on a project volume (new -> not external
    # like the docker_* observability volumes). Retention MUST stay bounded:
    # the box disk was 83% full at grounding time (2026-09-13) -> compactor
    # block_retention: 168h (7d) in tempo-config.yml. Only otel-collector and
    # grafana reach it, both in-project -> default network only.
    image: grafana/tempo:2.6.1
    labels:
      lifekit.contract: "none"  # platform component, not a product (scripts/platform-contract.py)
    command:
      - -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./observability/tempo:/etc/tempo:ro
      - tempo_data:/var/tempo
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 512
    expose:
      - "3200"
      - "4317"
    networks:
      - default

  grafana:
    <<: *policy
    image: grafana/grafana:11.2.0
    labels:
      lifekit.contract: "none"  # platform component, not a product (scripts/platform-contract.py)
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-}
      # Iframe embedding by the dashboard. Removing X-Frame-Options is only safe
      # because the CSP below pins frame-ancestors to the single origin in
      # GRAFANA_EMBED_ORIGIN (set explicitly or derived by deploy.sh from the tailnet
      # name and the dashboard's served port); unset -> 'none', so nothing can frame Grafana.
      # Coupling: anonymous Viewer (GF_AUTH_ANONYMOUS_*) stays OFF here. If
      # Grafana's exposure ever changes, anonymous Viewer must be reverted in the
      # same change. The rest of the CSP is Grafana 11's stock template ($$ =
      # compose escape for Grafana's $NONCE / $ROOT_PATH placeholders).
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY_TEMPLATE: >-
        script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $$NONCE;
        object-src 'none'; font-src 'self'; style-src 'self' 'unsafe-inline' blob:;
        img-src * data:; base-uri 'self';
        connect-src 'self' grafana.com ws://$$ROOT_PATH wss://$$ROOT_PATH;
        manifest-src 'self'; media-src 'none'; form-action 'self';
        frame-ancestors ${GRAFANA_EMBED_ORIGIN:-'none'};
      # Alert delivery — $TELEGRAM_BOT_TOKEN is expanded into
      # provisioning/alerting/contact-points.yml (the same devclaw bot
      # notify-relay uses, falling back to Kit's). The chat id is NOT passed:
      # Grafana re-types an all-digit env value as a number and the telegram
      # integration rejects it, so contact-points.yml carries it literally.
      TELEGRAM_BOT_TOKEN: ${DEVCLAW_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      # Secret ping URL of the external dead-man check; empty = disabled
      # (heartbeat.yml is then not rendered, scripts/render-heartbeat.sh).
      HEARTBEAT_URL: ${LIFEKIT_EXTERNAL_HEARTBEAT_URL:-}
      # Sign-in through the org identity provider (Logto, compose project
      # identity; docs/runbook.md "Grafana sign-in through Logto"). Off unless
      # GRAFANA_OIDC_ENABLED=true. The browser-facing /auth URL is the tailnet
      # issuer (GRAFANA_OIDC_ISSUER, derived by deploy.sh); the server-side
      # token and userinfo calls go straight to Logto over identity-oidc
      # (a container cannot reliably reach the host's own tailnet address
      # through the host firewall). Logto signs the id_token with the tailnet
      # issuer whichever host answered, and Grafana reads the role from the
      # userinfo `roles` claim: admin -> Admin, anyone else -> Viewer.
      # GRAFANA_OIDC_ONLY hides the password form; deploy.sh refuses it unless
      # sign-in is enabled and configured, so the local admin stays reachable.
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OIDC_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: lifekit
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email roles
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OIDC_ISSUER:-}/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://logto:3001/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://logto:3001/oidc/me
      # Only the Logto role admin gets a role; strict mode refuses any sign-in
      # where the path yields none (Grafana "Configure generic OAuth").
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'admin') && 'Admin' || ''"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      # Logto only admits members its admin created, so the first sign-in may
      # create the Grafana user.
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_OIDC_ONLY:-false}
      GF_AUTH_OAUTH_AUTO_LOGIN: ${GRAFANA_OIDC_ONLY:-false}
      TZ: ${OPENCLAW_TZ:-UTC}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Outside the read-only provisioning mount on purpose: docker cannot
      # create a mountpoint inside a :ro bind mount (verified 2026-09-06).
      - ${LIFEKIT_FINANCE_SENTRY_DASHBOARDS:-/srv/finance-sentry/grafana-dashboards}:/var/lib/grafana-dashboards/finance-sentry:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 512
    networks:
      - default
      # Reaches Logto's token and userinfo endpoints (identity project).
      - identity-oidc

  container-exporter:
    <<: *policy
    # The Docker daemon's own facts about EVERY container on the box - state,
    # restart count, health, exit code, memory - as Prometheus metrics. The
    # one signal the `box` alert rules in observability/grafana/provisioning/
    # alerting/rules.yml read, whichever repo owns the container. See
    # compose/container-exporter/exporter.py for the why.
    #
    # Read-only GETs on the socket, as nobody plus the docker group: deploy.sh
    # exports DOCKER_GID from the socket's owner group (override in .env).
    #
    # BUILDX_NO_DEFAULT_ATTESTATIONS=1 (scripts/deploy.sh) — see
    # openclaw-gateway's build block (compose/openclaw/): without it, Buildx's default
    # provenance attestation gives every build a new manifest-list digest
    # even with 100% layer cache hit, forcing a needless recreate on every
    # deploy.
    build:
      context: ./container-exporter
    image: container-exporter:local
    labels:
      lifekit.contract: "none"  # platform component, not a product (scripts/platform-contract.py)
    user: "65534:65534"
    group_add:
      - "${DOCKER_GID:-990}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Per-container memory.swap.current (the docker API has no swap figure).
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    read_only: true
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 128
    expose:
      - "9417"
    healthcheck:
      test:
        - CMD-SHELL
        # urlopen raises on any non-2xx, so a bad status is a non-zero exit.
        - "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:9417/health', timeout=3)\""
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default

  notify-relay:
    <<: *policy
    # The one renderer of owner notifications: a JSON envelope on /notify
    # (docs/message-format.md) or devclaw's legacy /devclaw + /text POSTs
    # become Telegram HTML via direct Bot API call. See compose/notify-relay/.
    # No host port binding — devclaw reaches it on the compose network
    # at http://notify-relay:8090.
    #
    # BUILDX_NO_DEFAULT_ATTESTATIONS=1 (scripts/deploy.sh) — see
    # openclaw-gateway's build block (compose/openclaw/): without it, Buildx's default
    # provenance attestation gives every build a new manifest-list digest
    # even with 100% layer cache hit, forcing a needless recreate on every
    # deploy.
    build:
      context: ./notify-relay
    image: notify-relay:local
    # Platform contract (scripts/platform-contract.py): /ready is a cached
    # Telegram getMe, /metrics is scraped as job `notify-relay`, logs are JSON
    # lines with a trace id.
    labels:
      lifekit.contract: "v1"
      lifekit.contract.port: "8090"
      lifekit.contract.health: /health
      lifekit.contract.ready: /ready
      lifekit.contract.metrics: /metrics
      lifekit.contract.ingress: internal
    # Cross-project seam (devclaw spec 005): join the external lifekit-shared
    # network so devclaw-mcp (in devclaw's own project) can reach us by service
    # name at http://notify-relay:8090. `default` keeps in-project DNS.
    networks:
      - default
      - lifekit-shared
    read_only: true
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 128
    environment:
      NOTIFY_RELAY_PORT: "8090"
      # notify-relay is devclaw's ONLY outbound voice, so it speaks through the
      # dedicated devclaw bot into the devclaw channel — NOT the main Kit bot.
      # (The inbound side, /goals/answer, is already on the devclaw bot; this
      # fixes the outbound asymmetry.) Falls back to the main bot/chat if the
      # devclaw-specific vars are unset.
      TELEGRAM_BOT_TOKEN: ${DEVCLAW_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      LIFEKIT_TELEGRAM_CHAT: ${DEVCLAW_CHAT:-${LIFEKIT_TELEGRAM_CHAT:-}}
      TZ: ${OPENCLAW_TZ:-UTC}
    expose:
      - "8090"
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # NOTE: the prior health-claw MCP wrapper service was removed in the v2
  # cutover. workout-claw + life-state are now Kit's workspace skills (called
  # as bash by the single Kit agent), not an MCP-wrapped sibling container.
  # See architecture-openclaw-modular-monolith memory + docs/openclaw-agent-design.md.

# ── Networks ────────────────────────────────────────────────────────────────
# `lifekit-shared` is an EXTERNAL network created and owned by devclaw's own
# compose project (devclaw spec 005). It's the cross-project seam: openclaw-gateway
# (in the `openclaw` project) reaches devclaw-mcp and notify-relay by service
# name, devclaw reaches notify-relay, and prometheus scrapes openclaw-gateway,
# across the project boundaries. Only the services that talk across it are
# attached (each also keeps `default` for in-project DNS). The devclaw-state named volume moved to devclaw's project too
# (mounted there as an external volume) — no service in THIS project uses it now.
networks:
  lifekit-shared:
    external: true
  # Logto's OIDC clients only (compose/identity/docker-compose.yml); created
  # once by scripts/deploy.sh before the first `up`.
  identity-oidc:
    external: true

# ── Secrets ─────────────────────────────────────────────────────────────────
# Sourced from the --env-file environment, not from a file on disk.
secrets:
  openclaw_gateway_token:
    environment: OPENCLAW_GATEWAY_TOKEN

# ── Volumes ─────────────────────────────────────────────────────────────────
# Observability data is EXTERNAL: it predates this project (finance-sentry's
# compose created it as docker_<name>) and must survive recreates. On a fresh
# box create the three volumes first (`docker volume create ...`) or point the
# LIFEKIT_*_VOLUME vars at the ones that exist. tempo_data is new with this
# project (issue #144), so it's a normal (non-external) project volume —
# LIFEKIT_TEMPO_VOLUME is a name override for parity with the pattern above,
# not a requirement to pre-create it.
volumes:
  loki_data:
    external: true
    name: ${LIFEKIT_LOKI_VOLUME:-docker_loki_data}
  prometheus_data:
    external: true
    name: ${LIFEKIT_PROMETHEUS_VOLUME:-docker_prometheus_data}
  grafana_data:
    external: true
    name: ${LIFEKIT_GRAFANA_VOLUME:-docker_grafana_data}
  tempo_data:
    name: ${LIFEKIT_TEMPO_VOLUME:-compose_tempo_data}
  otel_filelog_state:
    name: ${LIFEKIT_OTEL_FILELOG_VOLUME:-compose_otel_filelog_state}
