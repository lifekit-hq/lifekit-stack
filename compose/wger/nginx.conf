# nginx for the wger compose project (compose/wger/docker-compose.yml): the
# one front door. It serves the collected static files and the exercise media
# (images, videos) from the shared volumes and proxies everything else to the
# gunicorn app, and /ps/ to the PowerSync service (the mobile app's offline
# sync; wger hands the app SITE_URL/ps/). Adapted from the upstream wger docker
# setup's config/nginx.conf.
upstream wger {
    server web:8000;
}

# Behind Tailscale Serve the scheme arrives in X-Forwarded-Proto.
map $http_x_forwarded_proto $final_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;

    # Docker's embedded DNS. The PowerSync upstream is resolved per request (a
    # variable in proxy_pass), so wger itself still starts and serves while the
    # sync service is down or restarting; only /ps/ answers 502 then.
    resolver 127.0.0.11 valid=10s;

    location / {
        proxy_pass http://wger;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_http_version 1.1;
    }

    # PowerSync, used by the mobile app for offline mode. /ps/x -> powersync:8080/x.
    location /ps/ {
        set $powersync http://powersync:8080;
        rewrite ^/ps/(.*)$ /$1 break;
        proxy_pass $powersync;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;

        # WebSocket upgrade, for clients that use it.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Sync streams are long-lived and must not be buffered or cut short.
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        add_header X-Accel-Buffering no always;
    }

    location /static/ {
        root /wger;
    }

    location /media/ {
        alias /wger/media/;
    }

    # Room for exercise video uploads.
    client_max_body_size 100M;
}
