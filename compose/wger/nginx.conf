# nginx for the wger compose project (compose/wger/docker-compose.yml): the
# one front door. It serves the collected static files and the exercise media
# (images, videos) from the shared volumes and proxies everything else to the
# gunicorn app. Adapted from the upstream wger docker setup's config/nginx.conf
# without its PowerSync proxy (the mobile app's offline mode, not deployed).
upstream wger {
    server web:8000;
}

# Behind Tailscale Serve the scheme arrives in X-Forwarded-Proto.
map $http_x_forwarded_proto $final_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;

    location / {
        proxy_pass http://wger;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
        proxy_http_version 1.1;
    }

    location /static/ {
        root /wger;
    }

    location /media/ {
        alias /wger/media/;
    }

    # Room for exercise video uploads.
    client_max_body_size 100M;
}
