# Provisioned alert rules. Files, not clicks: deploy.sh reloads them through
# Grafana's admin API on every deploy. Delivery is policies.yml -> Telegram.
#
# Two groups. `box` is the ONE pipeline for every service on the box, read
# from compose/container-exporter (the daemon's own facts) and from `up`:
# a service does not have to export anything to be covered - it only has to
# be a container. `devclaw-deadman` keeps devclaw's application-level rule
# (a loop can be wedged while its process is healthy); "devclaw is down"
# moved into the generic target-down rule.
#
# Multi-series queries make one alert instance per label set, so every rule
# names the container in its summary. noDataState is chosen per rule: a
# vanished scrape target is an alarm (target-down); an empty container query
# is not - the exporter's own absence is target-down's job.
apiVersion: 1

# File provisioning only adds and updates; a rule dropped from `groups` stays
# loaded until it is named here. Keep retired uids listed.
deleteRules:
  - orgId: 1
    uid: devclaw-down  # folded into box/target-down, 2026-09-13
  - orgId: 1
    # Unfireable without a memory cap; container-oom-killed covers it, and
    # container-near-memory-cap is the capped-only successor.
    uid: container-memory-near-limit
  - orgId: 1
    # Retired 2026-09-28: permanent false positive, not a narrowable one.
    # node-exporter's own host bind (docker-compose.yml node-exporter
    # `volumes: - /:/host:ro,rslave`) pins the container's view of the /
    # mount to readonly=1 unconditionally for the life of the container,
    # regardless of the real superblock state - confirmed live: the box's
    # actual root mount reads `rw,errors=remount-ro` while this series sat
    # at 1. No Prometheus label (device, fstype, mountpoint, instance, job)
    # distinguishes that permanent artifact from a genuine future remount-ro
    # of the real host root on this box: both would be the exact same
    # series (device=/dev/vda3, fstype=ext4, mountpoint=/). Fixing detection
    # would require dropping node-exporter's `:ro` bind (a deliberate
    # security hardening choice, left alone here) - out of scope for this
    # rule file. Until that trade-off is revisited, this alert cannot fire
    # true and false positives with the same signature, so it is retired
    # rather than left permanently red.
    uid: root-filesystem-readonly
  - orgId: 1
    # Retired 2026-10-01: per-group budget thresholds alerted on legitimate
    # work (parallel agent sessions, an image rebuild). host-memory-pressure
    # alerts on real pressure and names the top groups; the budgets stay in
    # docs/resource-budget.md as documentation.
    uid: project-memory-over-budget
  - orgId: 1
    uid: host-group-over-budget
  - orgId: 1
    uid: burst-pool-over-budget

groups:
  - orgId: 1
    name: box
    folder: lifekit
    interval: 1m
    rules:
      - uid: target-down
        title: scrape target is down
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Every scrape job, one instance each. `up` is always present
              # for a configured target, so a missing series means the
              # target left the config - or Prometheus itself is gone.
              expr: up
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
        # A vanished target IS the alarm: no data must never read as healthy.
        noDataState: Alerting
        execErrState: Alerting
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not answering /metrics"
          description: >-
            Prometheus has not scraped {{ $labels.job }} ({{ $labels.instance }})
            for 3 minutes. The process is dead, crash-looping past the compose
            restart budget, or unreachable on the compose network. `docker ps`
            on the box; for devclaw `docker compose -p devclaw up -d` if the
            restart budget is spent.

      - uid: container-exited-abnormally
        title: container exited abnormally
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # 1 for a container that is not running, not between restarts,
              # and whose last exit code is non-zero: a crash the restart
              # policy gave up on (on-failure:5 spent), or a one-shot that
              # failed. Exit 0 is a stop, not an incident.
              expr: (1 - docker_container_running) * (1 - docker_container_restarting) * (docker_container_exit_code != bool 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} exited and is not coming back"
          description: >-
            Container {{ $labels.name }} (compose {{ $labels.project }}/{{ $labels.service }})
            has been stopped with a non-zero exit code for 3 minutes and the
            daemon is not restarting it. `docker logs --tail 100 {{ $labels.name }}`,
            then `docker compose -p {{ $labels.project }} up -d {{ $labels.service }}`.

      - uid: container-stopped-or-vanished
        title: long-running container is stopped or gone
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # container-exited-abnormally needs exit_code != 0, so a clean
              # `docker stop` (exit 0) is invisible to it, and a removed
              # container has no series at all (noDataState OK). Two legs
              # close both holes for long-running projects, whatever the exit
              # code: (1) 1 for a container that exists but is not running and
              # not between restarts; (2) a (project, service) that had a running
              # series 30 minutes ago and has none now - label_replace gives
              # it a `name` (the service) so the alert and its recovery line
              # carry a subject. Today's unscraped services this covers:
              # google-workspace-mcp, finance-sentry-postgres,
              # finance-sentry-uptime-probe, xui-web, xui-db. Not covered:
              # openclaw-cli (an on-demand profile service) and one-shot
              # projects outside the regex.
              # A deliberate service retirement fires once, for about 30
              # minutes: the vanished leg ends when the 30m offset window
              # passes the removal. A removal is not worth a second page.
              expr: >-
                ((1 - docker_container_running{project=~"compose|openclaw|docker|devclaw|dashboard|xui", service!="openclaw-cli"})
                  * (1 - docker_container_restarting{project=~"compose|openclaw|docker|devclaw|dashboard|xui", service!="openclaw-cli"}))
                or
                label_replace(
                  group by (project, service) (
                    docker_container_running{project=~"compose|openclaw|docker|devclaw|dashboard|xui", service!="openclaw-cli"} offset 30m)
                  unless
                  group by (project, service) (
                    docker_container_running{project=~"compose|openclaw|docker|devclaw|dashboard|xui", service!="openclaw-cli"}),
                  "name", "$1", "service", "(.*)")
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        # Silence is the normal state; the exporter's own absence is
        # target-down's job.
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} is stopped or gone"
          description: >-
            {{ $labels.name }} (compose {{ $labels.project }}/{{ $labels.service }})
            has not been running for 15 minutes - stopped cleanly, or removed
            with no replacement. If it was retired on purpose this fires once
            and clears itself within about 30 minutes. Otherwise
            `docker compose -p {{ $labels.project }} up -d {{ $labels.service }}`;
            `docker logs --tail 100 {{ $labels.name }}` shows how it stopped.

      - uid: container-restarting
        title: container is restart-looping
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Restarts the daemon performed in the last 15 minutes. A
              # crash loop under restart:unless-stopped never trips
              # container-exited-abnormally - the daemon keeps trying - so
              # this is the rule that would have caught finance-sentry-mcp
              # (4211 restarts over three days, 2026-09-10..13, unreported).
              expr: increase(docker_container_restart_count[15m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [2]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} is restart-looping"
          description: >-
            The daemon restarted {{ $labels.name }} (compose {{ $labels.project }}/{{ $labels.service }})
            more than twice in the last 15 minutes and it is still happening.
            `docker logs --tail 50 {{ $labels.name }}` shows why each start dies.

      - uid: container-unhealthy
        title: container healthcheck is failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Only containers that declare a healthcheck have this series;
              # 0 covers both unhealthy and stuck in starting.
              expr: docker_container_healthy
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} is unhealthy"
          description: >-
            {{ $labels.name }} (compose {{ $labels.project }}/{{ $labels.service }})
            has failed its own healthcheck for 5 minutes: the process is up but
            not serving. `docker inspect --format '{{"{{"}}json .State.Health{{"}}"}}' {{ $labels.name }}`
            shows the last probe output.

      - uid: docker-exporter-scrape-errors
        title: docker exporter scrape errors above zero
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # The exporter's own self-check: it stays `up` (a healthy HTTP
              # response) even when it cannot read the Docker daemon socket,
              # so every other `box` rule that reads docker_container_* goes
              # blind quietly instead of loudly (ls-177 audit §3.3).
              expr: docker_exporter_scrape_errors
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        # A vanished target is target-down's job, not this rule's.
        noDataState: OK
        execErrState: Error
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: the container exporter cannot read the Docker daemon
          description: >-
            docker_exporter_scrape_errors has been above zero for 3 minutes:
            the exporter still answers /metrics but every docker_container_*
            series it reports may be stale or missing, so the other `box`
            rules can no longer be trusted. `docker logs
            compose-container-exporter-1` and check the daemon socket mount.

      - uid: container-oom-killed
        title: a container was OOM-killed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Fires with or without a memory cap; it replaced a usage/limit
              # ratio rule that could not fire for uncapped containers, whose
              # limit reads as the whole box (ls-177 audit §4.3).
              expr: docker_container_oom_killed
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} was OOM-killed"
          description: >-
            docker_container_oom_killed is 1 for {{ $labels.name }} (compose
            {{ $labels.project }}/{{ $labels.service }}): the kernel killed a
            process in this container for using too much memory. `dmesg -T |
            grep -i "killed process"` and `docker logs --tail 100
            {{ $labels.name }}` show which process and what it was doing.

      - uid: root-filesystem-low-space
        title: root filesystem is low on free space
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Free space as a fraction of size, root mount only - node-exporter's
              # mount-points-exclude filter keeps pseudo and overlay filesystems
              # out of this series entirely, so there is exactly one instance.
              expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [0.15]}
        # A vanished node-exporter target is target-down's job, not this rule's.
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "root filesystem has less than 15% free space"
          description: >-
            node_filesystem_avail_bytes / node_filesystem_size_bytes for / has
            been below 15% for 10 minutes. `df -h /` on the box, then
            `docker system df` to find reclaimable image and build cache.

      - uid: tmp-filesystem-nearly-full
        title: /tmp is nearly full
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Free space as a fraction of size for /tmp, a 7.8GB tmpfs
              # (RAM-backed). node-exporter's own filesystem collector
              # excludes tmpfs, so these two gauges come from
              # scripts/tmp-gauge/tmp-usage-gauge.sh through the textfile
              # collector instead - the 2026-09-29 incident (/tmp hit 100%,
              # every Claude session on the box lost its tool output) had no
              # metric to catch it.
              expr: tmp_filesystem_avail_bytes / tmp_filesystem_size_bytes
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [0.20]}
        # A vanished node-exporter target is target-down's job; a stale or
        # missing gauge file is textfile-collector-stale's job.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "/tmp has less than 20% free space"
          description: >-
            tmp_filesystem_avail_bytes / tmp_filesystem_size_bytes has been below 20% for 5
            minutes: /tmp is a RAM-backed tmpfs, and filling it starves every process that
            writes there, including Claude Code tool output. The response is the host cleanup
            job (user crontab, outside this repo) that removes stale scratch hourly - it
            reports root-owned leftovers it cannot remove rather than deleting them. `df -h
            /tmp` and `du -sh /tmp/* 2>/dev/null | sort -rh | head` on the box show what is
            filling it.

      - uid: host-ram-nearly-exhausted
        title: host RAM available is critically low
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Available RAM as a fraction of total. Swap sitting near full
              # does not say RAM is short (Linux does not swap back in on its
              # own), so real pressure is read here; swap has its own rule,
              # host-swap-high.
              expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [0.10]}
        # A vanished node-exporter target is target-down's job.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "host RAM available has been under 10% for 5 minutes"
          description: >-
            node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes has
            been below 10% for 5 minutes: the box is under real memory
            pressure, not just its normal full-swap steady state. `free -h`
            and `ps --sort=-%mem` on the box; stop a runaway host process
            (never a compose-managed container, the Docker daemon, or a
            Claude session) if one is the cause.

      - uid: host-swap-and-ram-pressure
        title: host swap and RAM are both under pressure
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # This pairs swap with available RAM dropping too, so it is the
              # paging-under-pressure signal. Swap filling on its own is the
              # separate host-swap-high rule (memory-budget group).
              expr: >-
                (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
                  and ((node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes > 0.90)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [0.20]}
        # A vanished node-exporter target is target-down's job. An empty
        # result here is also the normal state: swap over 90% used with RAM
        # available at or above 20% is this box resting, not paging.
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "swap is over 90% used and host RAM available is under 20%"
          description: >-
            Swap used has been above 90% and
            node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes below
            20% together for 10 minutes. `free -h` and `ps --sort=-%mem` on
            the box; stop a runaway host process (never a compose-managed
            container, the Docker daemon, or a Claude session) if one is the
            cause.

      - uid: textfile-collector-stale
        title: textfile metrics are stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Age of each textfile-collector file; every gauge that writes one (the quota
              # gauge, the /tmp usage gauge, the host-group gauge) rewrites it every 5 minutes, so 15 minutes is
              # three missed runs.
              expr: time() - node_textfile_mtime_seconds
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [900]}
        # A vanished node-exporter target is target-down's job.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "textfile metric file {{ $labels.file }} has not been updated for over 15 minutes"
          description: >-
            node_textfile_mtime_seconds shows {{ $labels.file }} last written more than 15 minutes ago. Every gauge
            that writes into the textfile directory (the quota, /tmp usage, host-group and unit gauges' systemd
            timers) refreshes its file every 5 minutes, so its timer or script has stopped and rules
            reading that file are seeing stale values. `systemctl --failed`, the gauge unit's journal, and
            `systemctl list-timers` on the box.

      - uid: textfile-collector-scrape-error
        title: textfile collector cannot read a file
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # 1 when the textfile collector failed to read or parse a file.
              expr: node_textfile_scrape_error
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        # A vanished node-exporter target is target-down's job.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "node-exporter cannot read a textfile metrics file"
          description: >-
            node_textfile_scrape_error has been above zero for 5 minutes: node-exporter failed to parse or open a file
            in its textfile directory, so those gauges are missing from Prometheus. Check node-exporter's logs and the
            files in the textfile directory.

      - uid: host-unit-down-or-failed
        title: host systemd unit is down or failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # 1 for each host unit that is not active or is failed. The
              # CI runners, tailscaled and the lifekit timers live outside
              # Docker, so nothing else sees them; scripts/unit-gauge writes
              # both gauges through the textfile collector every 5 minutes.
              # For a lifekit timer the unit is its service: active tracks the
              # .timer and failed is the service's last Result, so a failed
              # run stays reported until the next successful run.
              expr: host_unit_failed + (1 - host_unit_active)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        # A vanished node-exporter target is target-down's job; a stale or
        # missing gauge file is textfile-collector-stale's job.
        noDataState: OK
        execErrState: Error
        # Two gauge runs, so a runner restart or a unit mid-redeploy does not page.
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "host unit {{ $labels.unit }} is down or failed"
          description: >-
            host_unit_active / host_unit_failed report {{ $labels.unit }} not active or failed
            for 10 minutes. `systemctl status {{ $labels.unit }}` and `journalctl -u {{ $labels.unit }}
            -n 50` on the box show why. A failed lifekit timer service stays reported until its next
            successful run; once the cause is fixed, `sudo systemctl reset-failed {{ $labels.unit }}.service`
            clears the state.

      # The shared Claude account is a box-level resource like disk: one Max
      # subscription serves every consumer on the box (the operator's sessions,
      # firstmate, devclaw, all OpenClaw agents), and every other guard only
      # watches its own corner. scripts/quota-gauge writes claude_quota_* from
      # `quota-axi --json` through node-exporter's textfile collector every
      # 5 minutes; these two rules watch the weekly window itself. No five-hour-window rule on purpose.
      - uid: claude-quota-behind-pace
        title: Claude weekly quota is behind pace
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # quota-axi's own pace condition: remaining % minus the % of the
              # window still ahead (100 * seconds-to-reset / 7d). Negative means
              # the week is being spent faster than it elapses.
              expr: claude_quota_reserve_percent_points{window="seven_day"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [0]}
        # No series means the gauge timer or node-exporter is gone: the
        # timer's own failure shows in `systemctl --failed`, the target in
        # target-down. Not this rule's job.
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Claude weekly quota remaining is below the fraction of the week left"
          description: >-
            claude_quota_reserve_percent_points{window="seven_day"} is
            {{ printf "%.0f" $values.B.Value }} points for 15 minutes: the
            account has less of the week left than the week has time left.
            `quota-axi` on the box shows every window and the burn multiple;
            the brakes are `openclaw cron disable` for non-essential crons,
            the firstmate quota wake, and devclaw's operator hold.

      - uid: claude-quota-nearly-exhausted
        title: Claude weekly quota is nearly exhausted
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Under 10% left with more than a day until the reset. Right
              # before the reset the same number is normal, so the reset time
              # gates the page.
              expr: >-
                claude_quota_percent_remaining{window="seven_day"}
                  and on(window) (claude_quota_resets_at_seconds{window="seven_day"} - time() > 86400)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [10]}
        # An empty result is the normal state (reset within a day, or the
        # gauge absent - see claude-quota-behind-pace).
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Claude weekly quota is under 10% with more than a day to the reset"
          description: >-
            claude_quota_percent_remaining{window="seven_day"} is
            {{ printf "%.0f" $values.B.Value }}% and the reset is more than 24h
            away. Every consumer on the box shares this account; the next step
            is "You've hit your weekly limit" on every agent. Disable
            non-essential OpenClaw crons (`openclaw cron disable <id>`), pause
            devclaw and firstmate launches, and spend the rest by hand.

  # Host memory pressure. docs/resource-budget.md says who uses what (the
  # per-group budgets are documentation, not alert thresholds: they fired on
  # legitimate work). One host-level rule alerts on pressure itself - available
  # RAM low or swap-in sustained - and names the top three groups by resident
  # memory in its own message, from the lifekit:group_memory_bytes recording
  # rule (prometheus/rules.yml). The capped-container and swap-fill rules below
  # are unchanged.
  - orgId: 1
    name: memory-budget
    folder: lifekit
    interval: 1m
    rules:
      - uid: host-memory-pressure
        title: host memory is under pressure
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Either signal (the rule's `for` holds it 15 minutes): available RAM
              # under 2 GiB (the critical host-ram-nearly-exhausted rule
              # fires at 10%, about 1.56 GiB, so this is its earlier
              # sibling), or swap-in over 1000 pages/s (about 4 MiB/s) - the
              # host paging memory back in, which is the slowdown itself.
              # host_vmstat_pswpin_pages_total comes from the host-group
              # gauge, rewritten every 5 minutes, so the rate window spans
              # at least two writes even if one write drifts by a scrape; until it exists the first side alone decides.
              expr: >-
                (node_memory_MemAvailable_bytes < (2 * 1073741824))
                or on()
                (rate(host_vmstat_pswpin_pages_total[15m]) > 1000)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
          # Rank 1 group by resident memory, for the message only.
          - refId: G1
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: G1
              expr: topk(1, lifekit:group_memory_bytes)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: R1
            datasourceUid: __expr__
            model:
              refId: R1
              type: reduce
              expression: G1
              reducer: last
              settings: {mode: dropNN}
          # Rank 2 group by resident memory, for the message only.
          - refId: G2
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: G2
              expr: topk(2, lifekit:group_memory_bytes) unless topk(1, lifekit:group_memory_bytes)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: R2
            datasourceUid: __expr__
            model:
              refId: R2
              type: reduce
              expression: G2
              reducer: last
              settings: {mode: dropNN}
          # Rank 3 group by resident memory, for the message only.
          - refId: G3
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: G3
              expr: topk(3, lifekit:group_memory_bytes) unless topk(2, lifekit:group_memory_bytes)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: R3
            datasourceUid: __expr__
            model:
              refId: R3
              type: reduce
              expression: G3
              reducer: last
              settings: {mode: dropNN}
        # A vanished node-exporter target is target-down's job.
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "host memory has been under pressure for 15 minutes"
          description: >-
            Available RAM under 2 GiB or swap-in over 1000 pages/s, held for
            15 minutes. Top groups by resident memory right now:
            1. {{ $values.R1.Labels.name }} {{ humanize1024 $values.R1.Value }}B,
            2. {{ $values.R2.Labels.name }} {{ humanize1024 $values.R2.Value }}B,
            3. {{ $values.R3.Labels.name }} {{ humanize1024 $values.R3.Value }}B
            (docs/resource-budget.md lists the members and what each is
            normally). `free -h`, `docker stats --no-stream`, `ps --sort=-rss`
            for the process. Never stop a compose-managed container, the
            Docker daemon, or a Claude session to free it.

      - uid: container-near-memory-cap
        title: a container is near its memory cap
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Usage as a percent of the cap. The limit series reads as the
              # whole box (MemTotal) for a container with no cap, so those
              # are filtered out: only a real cap, below 99% of RAM, counts.
              # This is what the retired container-memory-near-limit could
              # not do; the filter is the difference.
              expr: >-
                100 * docker_container_memory_usage_bytes
                / (docker_container_memory_limit_bytes < 0.99 * scalar(node_memory_MemTotal_bytes))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [90]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} is above 90% of its memory cap"
          description: >-
            {{ $labels.name }} (compose {{ $labels.project }}/{{ $labels.service }})
            has used {{ printf "%.0f" $values.B.Value }}% of its memory cap
            for 10 minutes (page cache excluded). The next step is the OOM
            killer. `docker stats --no-stream {{ $labels.name }}` shows
            the number; raise its `mem_limit` (or its `docker run --memory`)
            before it is killed, or find what grew.

      - uid: host-swap-high
        title: host swap is over 75% used
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Swap is margin, not budget (docs/resource-budget.md): it is
              # what absorbs a breach, so a swap that stays this full has no
              # room left for one. Alone - no pairing with available RAM.
              expr: >-
                100 * (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes)
                / node_memory_SwapTotal_bytes
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [75]}
        # A vanished node-exporter target is target-down's job; a box with no
        # swap divides by zero and yields nothing.
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "swap has been over 75% used for 15 minutes"
          description: >-
            Swap is {{ printf "%.0f" $values.B.Value }}% used, with or without
            RAM pressure: the safety margin behind the memory budgets is
            nearly gone. `free -h`, then `smem -rk` or `ps --sort=-%mem` for
            who holds it, and `docker stats --no-stream`. Tmpfs `/tmp` pages
            out to swap too (docs/runbook.md "Moving /tmp off RAM"). Never
            stop a compose-managed container, the Docker daemon, or a Claude
            session to free it.

  - orgId: 1
    name: devclaw-deadman
    folder: lifekit
    interval: 1m
    rules:
      - uid: devclaw-heartbeat-hung
        title: devclaw heartbeat is hung
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # 1 when the last tick is older than three tick lengths WHILE
              # dispatch is open — a held or windowed loop is idle by design,
              # never "stalled" (the O3-class false positive).
              expr: (devclaw_tick_age_seconds > bool 3 * devclaw_tick_seconds) * devclaw_dispatch_open
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        # No data here means the target is gone — that is target-down's job.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          service: devclaw
          severity: critical
        annotations:
          summary: devclaw answers HTTP but its heartbeat has not ticked
          description: >-
            devclaw_tick_age_seconds exceeded three tick lengths with dispatch
            open for 5 minutes: the tick loop is wedged while the MCP server
            still serves. `/health` shows last_tick_at; a restart of devclaw-mcp
            reaps and resumes in-flight sandboxes.

      - uid: devclaw-token-burn-high
        title: devclaw token burn is elevated
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Usage reports arrive in bursts, not a steady stream - only
              # ~4% of sessions report usage at all (guard-6-gaps-secrets
              # report, gap 3), so this counter jumps in irregular spikes
              # rather than climbing smoothly. Summed across kind so one
              # instance covers total spend. Live history (7d, 2026-09-17):
              # four nonzero hourly increases out of 168, of 8.4M, 8.8M,
              # 15.1M and 26.8M tokens; 15M is picked as the warning line so
              # it catches the two larger bursts without paging on ordinary
              # ones. There is no hard cap to warn ahead of yet (the gap this
              # rule narrows) - revisit the threshold once one exists.
              expr: sum(increase(devclaw_tokens_total[1h]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [15000000]}
        # No data means the exporter or its target is gone - target-down's job.
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          service: devclaw
          severity: warning
        annotations:
          summary: devclaw burned more than 15M tokens in the last hour
          description: >-
            sum(increase(devclaw_tokens_total[1h])) is {{ printf "%.0f" $values.B.Value }},
            above the 15,000,000/hour warning line. This is a heads-up, not a
            hard cap - none exists yet. `docker logs devclaw-mcp` and
            `/metrics` on the box show which kind (input/output/cache_read/
            cache_creation) moved and which sessions are running.

  - orgId: 1
    name: notify-relay-deadman
    folder: lifekit
    interval: 1m
    rules:
      - uid: notify-relay-cannot-deliver
        title: notify-relay cannot deliver
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # 1 when the last 15 minutes had at least one failed Telegram
              # send and zero successful ones: a single transient Telegram
              # blip must not page (it lands beside at least one ok in the
              # same window), sustained total failure must.
              expr: >-
                (increase(notify_relay_telegram_sends_total{outcome="error"}[15m]) > bool 0)
                  * (increase(notify_relay_telegram_sends_total{outcome="ok"}[15m]) == bool 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        # A vanished target is target-down's job, not this rule's - it only
        # reads when the counter series exists at all.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          service: notify-relay
          severity: critical
        annotations:
          summary: notify-relay is up but every Telegram send is failing
          description: >-
            notify_relay_telegram_sends_total{outcome="error"} rose with zero
            {outcome="ok"} in the same 15-minute window, sustained for 5
            minutes: notify-relay answers /metrics but cannot deliver to
            Telegram. Known limitation: this alert reaches the owner over
            Telegram, the same channel it reports broken - that still works
            for a bad token, a wrong chat id, or a relay bug, because Grafana
            holds its own bot credential and posts directly, but it gives no
            coverage when Telegram itself or the box's egress is down. Check
            notify-relay's logs for the Telegram API error, then the bot
            token and chat id in the env file.

  - orgId: 1
    name: openclaw
    folder: lifekit
    interval: 1m
    rules:
      - uid: openclaw-run-failed
        title: openclaw scheduled or background run failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Failed agent runs in the last 15 minutes, from the
              # diagnostics-prometheus exporter. OpenClaw 2026.9.4 exports no
              # cron- or task-ledger series (checked against the plugin
              # source); every cron agentTurn and background task is an
              # agent run, reported once as run.completed with its outcome.
              # A timeout is outcome="aborted" and a hook block
              # outcome="blocked", so the cron block counts all three. Other
              # background triggers count errors only: an abort there is
              # usually a deliberate stop.
              # Each block pairs increase() with a missing-sample check: the
              # exporter creates a series at its first event, and increase()
              # reads a series born at 1 as 0 - also when the same label set
              # stood at 1 before a gateway restart, since 1 -> 1 is no reset.
              # So a series also fires while it has fewer samples in the window
              # than the openclaw target had successful scrapes: it was absent
              # from a good scrape, i.e. (re)born inside the window. A failed
              # scrape drops one sample from both counts, and the first scrapes
              # after a deploy have both counts equal, so neither pages.
              # Command-kind cron jobs start no agent run and are not seen here.
              # Trigger values seen in OpenClaw 2026.9.4 core: user, cron,
              # heartbeat, memory, overflow, manual, cli. Interactive turns
              # (trigger="user") are excluded on purpose - the person chatting
              # already sees the error - so background task or subagent runs
              # labelled "user" are not covered either.
              expr: >-
                sum by (trigger, outcome) (
                  (increase(openclaw_run_completed_total{trigger="cron", outcome=~"error|aborted|blocked"}[15m]) > 0)
                  or
                  (openclaw_run_completed_total{trigger="cron", outcome=~"error|aborted|blocked"}
                    and (count_over_time(openclaw_run_completed_total{trigger="cron", outcome=~"error|aborted|blocked"}[15m])
                      < on() group_left() sum_over_time(up{job="openclaw"}[15m])))
                )
                or
                sum by (trigger, outcome) (
                  (increase(openclaw_run_completed_total{trigger!~"cron|user", outcome="error"}[15m]) > 0)
                  or
                  (openclaw_run_completed_total{trigger!~"cron|user", outcome="error"}
                    and (count_over_time(openclaw_run_completed_total{trigger!~"cron|user", outcome="error"}[15m])
                      < on() group_left() sum_over_time(up{job="openclaw"}[15m])))
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        # No failures means no series. The exporter being gone is
        # target-down's job (job="openclaw").
        noDataState: OK
        execErrState: Error
        # One failure is the signal: the window is 15 minutes, so a longer
        # pending period would let a single failed daily cron resolve unseen.
        for: 0s
        labels:
          service: openclaw
          severity: critical
        annotations:
          summary: "OpenClaw {{ $labels.trigger }} runs ended {{ $labels.outcome }}"
          description: >-
            {{ printf "%.0f" $values.B.Value }} OpenClaw agent run(s) with
            trigger {{ $labels.trigger }} ended {{ $labels.outcome }} in the
            last 15 minutes. On the box: `docker exec
            openclaw-openclaw-gateway-1 openclaw cron list --all`, then `openclaw
            cron runs <job-id>` for the error; `openclaw tasks list --status
            failed` (also timed_out, lost) and `openclaw tasks audit` for
            background tasks. An expired Claude or OpenAI login fails every run
            at once.

      - uid: claude-oauth-token-expiring
        title: Claude service token expires within 30 days
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Days until CLAUDE_OAUTH_TOKEN (the gateway's one-year
              # `claude setup-token`, SecretRef claude-oauth-token) expires.
              # Nothing exports the expiry, so the date is written here: the
              # epoch is the expiry date in the token's docs/secrets.md
              # inventory row (a test keeps them equal). The yearly rotation
              # (docs/secrets-runbook.md) updates both.
              # CLAUDE_OAUTH_TOKEN expires 2027-09-30T00:00:00Z = 1822262400.
              expr: (vector(1822262400) - time()) / 86400
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [30]}
        # vector() always returns a sample while Prometheus answers; its
        # absence is target-down's job.
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          service: openclaw
          severity: warning
        annotations:
          summary: 'Claude service token expires in {{ printf "%.0f" $values.B.Value }} days'
          description: >-
            CLAUDE_OAUTH_TOKEN (every OpenClaw agent's anthropic:setup-token
            profile) expires in {{ printf "%.0f" $values.B.Value }} days; after
            that every agent turn fails. Rotate it: `claude setup-token`, then
            `scripts/secrets/edit.sh gateway` (replace CLAUDE_OAUTH_TOKEN),
            and move the expiry date in this rule and in docs/secrets.md in
            the same PR (docs/secrets-runbook.md, "Claude service token").

  # finance-sentry's backup and retention jobs export their own age gauges
  # (JobMetrics.cs); without these rules a silently stopped backup or purge
  # on the finance app looks the same as "nothing happened".
  - orgId: 1
    name: finance-sentry-jobs
    folder: lifekit
    interval: 1m
    rules:
      - uid: finance-backup-verify-stale
        title: finance-sentry backup verification is stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Seconds since the last backup that provably restored. The restore-verify
              # job (db-restore-verify) runs weekly, so 9 days is one missed run plus
              # two days of slack. The API seeds this gauge from the database at
              # startup, so an absent series while the API is up means no verified
              # backup exists: it reads as a 1e12 s sentinel (over any threshold).
              expr: >-
                finance_backup_last_verified_age_seconds
                or on() (vector(1e12) and on() (up{job="finance-sentry-api"} == 1))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [777600]}
        # target-down only covers the scrape target disappearing; a missing
        # series while the API is up is the absent branch of the query above.
        # With the target down there is no data, which stays OK here.
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          service: finance-sentry
          severity: warning
        annotations:
          summary: "finance-sentry has no verified backup for over 9 days"
          description: >-
            {{ if gt $values.B.Value 31536000.0 }}finance_backup_last_verified_age_seconds
            is absent while finance-sentry-api is up: no verified backup is
            recorded.{{ else }}finance_backup_last_verified_age_seconds is
            {{ humanizeDuration $values.B.Value }}: no backup has
            provably restored since then.{{ end }} The weekly db-restore-verify Hangfire job
            has stopped or is failing, or the db-backup job feeding it has. Check
            the finance-sentry-api logs and the Hangfire dashboard for
            db-backup and db-restore-verify.

      - uid: finance-retention-stale
        title: finance-sentry retention run is stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Seconds since the last successful retention run, per run_type (Purge and
              # Downsample). Both are daily Hangfire jobs, so 2 days is a missed run
              # plus a day of slack. The startup primer seeds only Purge, so an absent
              # Purge series while the API is up reads as a 1e12 s sentinel. An absent
              # Downsample series is deliberately not alerted on: it only exists
              # after its first run following a restart.
              expr: >-
                finance_retention_last_run_age_seconds
                or on(run_type) (label_replace(vector(1e12), "run_type", "Purge", "", "")
                and on() (up{job="finance-sentry-api"} == 1))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [172800]}
        # target-down only covers the scrape target disappearing; a missing
        # Purge series while the API is up is the absent branch of the query
        # above. With the target down there is no data, which stays OK here.
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          service: finance-sentry
          severity: warning
        annotations:
          summary: "finance-sentry {{ $labels.run_type }} retention has not run for over 2 days"
          description: >-
            {{ if gt $values.B.Value 31536000.0 }}finance_retention_last_run_age_seconds
            for run_type {{ $labels.run_type }} is absent while finance-sentry-api
            is up: no successful run is recorded.{{ else }}finance_retention_last_run_age_seconds
            for run_type {{ $labels.run_type }} is
            {{ humanizeDuration $values.B.Value }}.{{ end }} The daily
            retention-purge / retention-downsample Hangfire job has stopped or is
            failing, so expired data is not being removed. Check the
            finance-sentry-api logs and the Hangfire dashboard.

  # ls-177 S1: the alerting system watching itself. Grafana and Prometheus
  # both now feed their own /metrics into Prometheus (prometheus.yml); these
  # rules are the alert path's self-test - without them a broken Telegram
  # delivery, a stuck config reload, or a failing compaction all look the
  # same as "nothing happened" from the outside.
  - orgId: 1
    name: observability
    folder: lifekit
    interval: 1m
    rules:
      - uid: grafana-notification-delivery-failing
        title: Grafana alert notification delivery is failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Either counter rising means the same thing: a rule fired and
              # the page did not reach the contact point. Every rule in this
              # file - and every rule that follows it - is worthless if this
              # goes unwatched (ls-177 audit §3.1, the highest-value gap).
              expr: >-
                sum(increase(grafana_alerting_notifications_failed_total[15m]))
                  or
                sum(increase(grafana_alerting_notification_requests_failed_total[15m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        # A vanished Grafana target is target-down's job, not this rule's.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          service: grafana
          severity: critical
        annotations:
          summary: Grafana could not deliver an alert notification
          description: >-
            grafana_alerting_notifications_failed_total or
            grafana_alerting_notification_requests_failed_total rose in the
            last 15 minutes and stayed above zero for 5 minutes: Grafana
            evaluated a rule and the notification did not reach the contact
            point. Known limitation: this alert itself reaches the owner
            through the same Telegram path, so it gives no coverage if
            Telegram or the box's egress is down - check the Grafana
            container logs for the delivery error, then the bot token and
            chat id in contact-points.yml.

      - uid: grafana-rule-evaluation-failing
        title: Grafana alert rule evaluation is failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # A rule stuck in execErrState: Error shows only in the
              # Grafana UI today; nothing outside it can see the failure.
              expr: sum(increase(grafana_alerting_rule_evaluation_failures_total[15m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          service: grafana
          severity: critical
        annotations:
          summary: a Grafana alert rule is erroring instead of evaluating
          description: >-
            grafana_alerting_rule_evaluation_failures_total rose in the last
            15 minutes and stayed above zero for 5 minutes: at least one
            provisioned rule is failing to evaluate (a bad query, a
            datasource error) rather than reporting Normal or Alerting.
            The Grafana alerting UI shows which rule and its last error.

      - uid: prometheus-config-reload-failing
        title: Prometheus config reload is not successful
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # deploy.sh SIGHUPs Prometheus on every deploy; a bad
              # prometheus.yml leaves the OLD config running silently behind
              # a green deploy (ls-177 audit §3.1).
              expr: prometheus_config_last_reload_successful
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
        # A vanished Prometheus target is target-down's job, not this rule's.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          service: prometheus
          severity: critical
        annotations:
          summary: Prometheus is serving a stale config
          description: >-
            prometheus_config_last_reload_successful has been 0 for 5
            minutes: the last SIGHUP reload (deploy.sh, or a manual
            `promtool` edit) failed and Prometheus is still running its
            previous config. Check the Prometheus container logs for the
            parse error, fix prometheus.yml, and reload again.

      - uid: prometheus-tsdb-compaction-failing
        title: Prometheus TSDB compaction is failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Compaction failures mean storage is degrading before the 5GB
              # retention cap silently starts evicting history.
              expr: increase(prometheus_tsdb_compactions_failed_total[15m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          service: prometheus
          severity: warning
        annotations:
          summary: Prometheus TSDB compaction is failing
          description: >-
            prometheus_tsdb_compactions_failed_total rose in the last 15
            minutes: the local block storage is not compacting cleanly.
            Left alone this degrades query performance and can eventually
            block ingestion. Check the Prometheus container logs for the
            compaction error and the disk behind the `prometheus_data`
            volume.

      - uid: prometheus-notifications-dropped
        title: Prometheus is dropping notifications
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Prometheus queues notifications for its configured
              # Alertmanager receivers and drops them if the queue is full or
              # every receiver is unreachable - a silent loss on the way out,
              # independent of grafana-notification-delivery-failing.
              expr: increase(prometheus_notifications_dropped_total[15m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          service: prometheus
          severity: critical
        annotations:
          summary: Prometheus is dropping outgoing notifications
          description: >-
            prometheus_notifications_dropped_total rose in the last 15
            minutes: Prometheus could not hand a notification to a
            configured Alertmanager receiver. Check the Prometheus container
            logs for the delivery error.
