# Provisioned alert rules. Files, not clicks: deploy.sh reloads them through
# Grafana's admin API on every deploy. Delivery is policies.yml -> Telegram.
#
# Two groups. `box` is the ONE pipeline for every service on the box, read
# from compose/container-exporter (the daemon's own facts) and from `up`:
# a service does not have to export anything to be covered - it only has to
# be a container. `devclaw-deadman` keeps devclaw's application-level rule
# (a loop can be wedged while its process is healthy); "devclaw is down"
# moved into the generic target-down rule.
#
# Multi-series queries make one alert instance per label set, so every rule
# names the container in its summary. noDataState is chosen per rule: a
# vanished scrape target is an alarm (target-down); an empty container query
# is not - the exporter's own absence is target-down's job.
apiVersion: 1

# File provisioning only adds and updates; a rule dropped from `groups` stays
# loaded until it is named here. Keep retired uids listed.
deleteRules:
  - orgId: 1
    uid: devclaw-down  # folded into box/target-down, 2026-09-13

groups:
  - orgId: 1
    name: box
    folder: lifekit
    interval: 1m
    rules:
      - uid: target-down
        title: scrape target is down
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Every scrape job, one instance each. `up` is always present
              # for a configured target, so a missing series means the
              # target left the config - or Prometheus itself is gone.
              expr: up
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
        # A vanished target IS the alarm: no data must never read as healthy.
        noDataState: Alerting
        execErrState: Alerting
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not answering /metrics"
          description: >-
            Prometheus has not scraped {{ $labels.job }} ({{ $labels.instance }})
            for 3 minutes. The process is dead, crash-looping past the compose
            restart budget, or unreachable on the compose network. `docker ps`
            on the box; for devclaw `docker compose -p devclaw up -d` if the
            restart budget is spent.

      - uid: container-exited-abnormally
        title: container exited abnormally
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # 1 for a container that is not running, not between restarts,
              # and whose last exit code is non-zero: a crash the restart
              # policy gave up on (on-failure:5 spent), or a one-shot that
              # failed. Exit 0 is a stop, not an incident.
              expr: (1 - docker_container_running) * (1 - docker_container_restarting) * (docker_container_exit_code != bool 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} exited and is not coming back"
          description: >-
            Container {{ $labels.name }} (compose {{ $labels.project }}/{{ $labels.service }})
            has been stopped with a non-zero exit code for 3 minutes and the
            daemon is not restarting it. `docker logs --tail 100 {{ $labels.name }}`,
            then `docker compose -p {{ $labels.project }} up -d {{ $labels.service }}`.

      - uid: container-restarting
        title: container is restart-looping
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Restarts the daemon performed in the last 15 minutes. A
              # crash loop under restart:unless-stopped never trips
              # container-exited-abnormally - the daemon keeps trying - so
              # this is the rule that would have caught finance-sentry-mcp
              # (4211 restarts over three days, 2026-09-10..13, unreported).
              expr: increase(docker_container_restart_count[15m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [2]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} is restart-looping"
          description: >-
            The daemon restarted {{ $labels.name }} (compose {{ $labels.project }}/{{ $labels.service }})
            more than twice in the last 15 minutes and it is still happening.
            `docker logs --tail 50 {{ $labels.name }}` shows why each start dies.

      - uid: container-unhealthy
        title: container healthcheck is failing
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Only containers that declare a healthcheck have this series;
              # 0 covers both unhealthy and stuck in starting.
              expr: docker_container_healthy
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} is unhealthy"
          description: >-
            {{ $labels.name }} (compose {{ $labels.project }}/{{ $labels.service }})
            has failed its own healthcheck for 5 minutes: the process is up but
            not serving. `docker inspect --format '{{"{{"}}json .State.Health{{"}}"}}' {{ $labels.name }}`
            shows the last probe output.

      - uid: container-memory-near-limit
        title: container memory near its limit
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Working set over the cgroup limit (the compose memory cap).
              # A container without a cap reports the host total as its
              # limit and stays far below this.
              expr: docker_container_memory_usage_bytes / docker_container_memory_limit_bytes
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.9]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} is above 90% of its memory limit"
          description: >-
            {{ $labels.name }} (compose {{ $labels.project }}/{{ $labels.service }})
            has used more than 90% of its memory cap for 10 minutes. The next
            step is the OOM killer and a restart. `docker stats --no-stream {{ $labels.name }}`.

      - uid: root-filesystem-low-space
        title: root filesystem is low on free space
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Free space as a fraction of size, root mount only - node-exporter's
              # mount-points-exclude filter keeps pseudo and overlay filesystems
              # out of this series entirely, so there is exactly one instance.
              expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [0.15]}
        # A vanished node-exporter target is target-down's job, not this rule's.
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "root filesystem has less than 15% free space"
          description: >-
            node_filesystem_avail_bytes / node_filesystem_size_bytes for / has
            been below 15% for 10 minutes. `df -h /` on the box, then
            `docker system df` to find reclaimable image and build cache.

  - orgId: 1
    name: devclaw-deadman
    folder: lifekit
    interval: 1m
    rules:
      - uid: devclaw-heartbeat-hung
        title: devclaw heartbeat is hung
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # 1 when the last tick is older than three tick lengths WHILE
              # dispatch is open — a held or windowed loop is idle by design,
              # never "stalled" (the O3-class false positive).
              expr: (devclaw_tick_age_seconds > bool 3 * devclaw_tick_seconds) * devclaw_dispatch_open
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        # No data here means the target is gone — that is target-down's job.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          service: devclaw
          severity: critical
        annotations:
          summary: devclaw answers HTTP but its heartbeat has not ticked
          description: >-
            devclaw_tick_age_seconds exceeded three tick lengths with dispatch
            open for 5 minutes: the tick loop is wedged while the MCP server
            still serves. `/health` shows last_tick_at; a restart of devclaw-mcp
            reaps and resumes in-flight sandboxes.

  - orgId: 1
    name: openclaw
    folder: lifekit
    interval: 1m
    rules:
      - uid: openclaw-run-failed
        title: openclaw scheduled or background run failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              # Failed agent runs in the last 15 minutes, from the
              # diagnostics-prometheus exporter. OpenClaw 2026.9.4 exports no
              # cron- or task-ledger series (checked against the plugin
              # source); every cron agentTurn and background task is an
              # agent run, reported once as run.completed with its outcome.
              # A timeout is outcome="aborted" and a hook block
              # outcome="blocked", so the cron block counts all three. Other
              # triggers (the captain's turns, subagents) count errors only:
              # an abort there is usually a deliberate stop.
              # Each block pairs increase() with `x unless x offset 15m`:
              # the exporter creates a series at its first event, and
              # increase() reads a series born at 1 as 0 - without the second
              # half the first failure after every gateway restart is missed.
              # Command-kind cron jobs start no agent run and are not seen here.
              expr: >-
                sum by (trigger, outcome) (
                  (increase(openclaw_run_completed_total{trigger="cron", outcome=~"error|aborted|blocked"}[15m]) > 0)
                  or
                  (openclaw_run_completed_total{trigger="cron", outcome=~"error|aborted|blocked"}
                    unless openclaw_run_completed_total{trigger="cron", outcome=~"error|aborted|blocked"} offset 15m)
                )
                or
                sum by (trigger, outcome) (
                  (increase(openclaw_run_completed_total{trigger!="cron", outcome="error"}[15m]) > 0)
                  or
                  (openclaw_run_completed_total{trigger!="cron", outcome="error"}
                    unless openclaw_run_completed_total{trigger!="cron", outcome="error"} offset 15m)
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        # No failures means no series. The exporter being gone is
        # target-down's job (job="openclaw").
        noDataState: OK
        execErrState: Error
        # One failure is the signal: the window is 15 minutes, so a longer
        # pending period would let a single failed daily cron resolve unseen.
        for: 0s
        labels:
          service: openclaw
          severity: critical
        annotations:
          summary: "OpenClaw {{ $labels.trigger }} runs ended {{ $labels.outcome }}"
          description: >-
            {{ printf "%.0f" $values.B.Value }} OpenClaw agent run(s) with trigger
            {{ $labels.trigger }} ended {{ $labels.outcome }} in the last 15
            minutes. On the box: `docker exec compose-openclaw-gateway-1 openclaw
            cron list --all`, then `openclaw cron runs <job-id>` for the error;
            `openclaw tasks list --status failed` (also timed_out, lost) and
            `openclaw tasks audit` for background tasks. An expired Claude or
            OpenAI login fails every run at once.
