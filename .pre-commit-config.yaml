repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # compose's `!reset` tag has no PyYAML constructor; yamllint still lints the file
        exclude: ^compose/openclaw/trusted-proxy\.yml$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^docs/PRIVATE\.md$
      - id: mixed-line-ending

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-d", "{extends: default, rules: {line-length: {max: 140}, document-start: disable}}"]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint-docker
        # Accepted backlog: DL3006/DL4006/DL3016/DL3042 warnings on working prod
        # images still print but don't block CI. Only errors fail. Revisit to fix
        # the Dockerfiles properly and drop this threshold.
        args: ["--failure-threshold", "error"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-doc-drift
        name: README <-> compose service-count parity
        entry: scripts/check-doc-drift.sh
        language: script
        pass_filenames: false
        files: ^(README\.md|compose/docker-compose\.yml)$
