name: Weekly Release

# Cuts a release once a week by merging the Release Please PR that accumulates on main.
# Release Please keeps that PR current on every merge; this job just lands it on a cadence.
# No releasable commits since the last release → no PR → the job no-ops.
#
# Every step acts as the release bot app (the same app release-please pushes with), not
# GITHUB_TOKEN, whose activity fires no workflows (#176):
#   - before the merge: the app's pushes to the release branch trigger the pull_request CI
#     runs, so the checks main requires report on the PR like on any other contributor's.
#   - the merge is a real push to main: Release Please tags + publishes the GitHub release
#     and CI's deploy job ships the release commit to the VPS through their normal push
#     triggers.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch: # manual "release now"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Merge pending release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --state open --label "autorelease: pending" --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "No pending release PR — nothing to release this week."
            exit 0
          fi

          branch=$(gh pr view "$pr" --json headRefName --jq .headRefName)

          # main requires the branch to be up to date (strict). Release Please rebuilds
          # the branch only when the PR content changes, so commits hidden from the
          # changelog (ci, chore, ...) can leave it behind main.
          behind() { gh api "repos/$GH_REPO/compare/main...$branch" --jq .behind_by; }
          if [[ "$(behind)" -gt 0 ]]; then
            echo "Release branch is behind main - updating it"
            gh pr update-branch "$pr"
            for _ in $(seq 1 24); do
              [[ "$(behind)" -eq 0 ]] && break
              sleep 5
            done
            [[ "$(behind)" -eq 0 ]] || { echo "Release branch is still behind main"; exit 1; }
          fi

          # The release branch gets its checks from pull_request runs on every push to it.
          # A branch update just above needs a moment to register them; then wait for any
          # still in flight - a failed check aborts before the merge.
          for _ in $(seq 1 24); do
            checks=$(gh pr checks "$pr" --json name --jq length 2>/dev/null || true)
            [[ "${checks:-0}" -gt 0 ]] && break
            sleep 5
          done
          gh pr checks "$pr" --watch --fail-fast

          echo "Merging release PR #$pr"
          gh pr merge "$pr" --squash --delete-branch
