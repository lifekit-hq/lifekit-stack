name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Pre-commit (gitleaks, yamllint, shellcheck, hadolint, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history

      # setup-python@v5 can't provision Python on the arm64 self-hosted deploy
      # runner, so pre-commit runs from a throwaway venv rather than relying on
      # a provisioned interpreter that would differ between hosted and
      # self-hosted jobs.
      - name: Run pre-commit
        run: |
          python3 -m venv "$RUNNER_TEMP/pcvenv"
          "$RUNNER_TEMP/pcvenv/bin/pip" install --quiet --upgrade pip pre-commit
          "$RUNNER_TEMP/pcvenv/bin/pre-commit" run --all-files --show-diff-on-failure --color=always

      # Folded in from the former standalone doc-drift.yml so it no longer
      # consumes its own runner slot per PR.
      - name: Check doc drift (README <-> compose service-count parity)
        run: bash scripts/check-doc-drift.sh

  pytest:
    name: Tests (container-exporter, quota-share, ops-report, platform-contract)
    uses: lifekit-hq/.github/.github/workflows/python-ci.yml@v1
    with:
      install: "-r requirements.txt"
      run: "python -m pytest -q compose/container-exporter/tests scripts/quota-share/tests scripts/ops-report/tests scripts/tests"
      runner: '"ubuntu-latest"'

  notify-relay-tests:
    name: Tests (notify-relay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # notify-relay's renderer + route tests (node:test, no deps), run in the
      # image the relay itself is built from; --network none proves nothing
      # reaches Telegram.
      - name: Run notify-relay tests
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/compose/notify-relay:/app:ro" -w /app \
            node:22-trixie-slim node --test

  gitleaks-full:
    name: Gitleaks full-history scan
    uses: lifekit-hq/.github/.github/workflows/secrets-scan.yml@v1
    with:
      mode: git
      runner: '"ubuntu-latest"'

  secrets-gateway-decrypt:
    name: Secrets (gateway file decrypts with the on-box gateway key)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Proves the real, on-box gateway age key (docs/secrets-runbook.md,
      # "One-time cutover" step 1) can open secrets/lifekit-gateway.env.sops -
      # the box fact scripts/tests/test_secrets.py cannot check, since that
      # key never leaves the self-hosted runner's box. Only the pinned sops
      # binary and this workflow step touch it; values are never printed,
      # only the exit status. The master file is never decrypted in CI, by
      # design (docs/secrets.md): no service account can open it.
      - name: Install pinned sops
        run: bash compose/openclaw-gateway/install-sops.sh "$RUNNER_TEMP/bin"

      - name: Decrypt the gateway file with the on-box gateway key
        env:
          PATH: ${{ runner.temp }}/bin:/usr/bin:/bin
          SOPS_AGE_KEY_FILE: /srv/lifekit-secrets/gateway/lifekit-gateway.agekey
        run: |
          sops --input-type dotenv --output-type dotenv --decrypt \
            secrets/lifekit-gateway.env.sops > /dev/null

  deploy:
    name: Deploy to VPS
    needs: [lint, pytest, notify-relay-tests, gitleaks-full, secrets-gateway-decrypt]
    # main only: Weekly Release dispatches this workflow on the release-please branch to
    # get the required checks onto the release PR (#176), and that must never deploy.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      # Four merges within ~50 minutes on 2026-09-13 queued four deploys on
      # this concurrency group; each one deployed whatever origin/main was at
      # ITS start, not the commit that triggered it (#147). Killing an
      # in-progress deploy mid-migration is not acceptable
      # (cancel-in-progress: true), so instead: if a newer run is already
      # queued behind us, it will deploy a newer SHA moments after we finish —
      # deploying now is wasted work, skip it. GitHub reports a run blocked by
      # this concurrency group as "queued" at the run level, which is what
      # this checks.
      - name: Skip if superseded
        id: superseded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newer=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --branch main \
            --status queued --json databaseId \
            --jq "[.[] | select(.databaseId > ${GITHUB_RUN_ID})] | length")
          if [[ "${newer}" -gt 0 ]]; then
            echo "Superseded by a newer queued run for main; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.superseded.outputs.skip != 'true'
        env:
          # Deploy the SHA that triggered this run, not "origin/main right
          # now" — see the comment above and DEPLOY_REF in deploy.sh.
          DEPLOY_REF: ${{ github.sha }}
        run: |
          cd /srv/lifekit-stack
          bash scripts/deploy.sh

      - name: Smoke check
        if: steps.superseded.outputs.skip != 'true'
        run: |
          cd /srv/lifekit-stack
          docker compose -f compose/docker-compose.yml --env-file /srv/lifekit-secrets/stack.env ps \
            --format "table {{.Service}}\t{{.State}}\t{{.Status}}"

      # (The post-deploy devclaw eval smoke was retired 2026-08-16: it targeted
      # the devclaw-mcp service in THIS compose file, which left with spec 005 —
      # every main deploy failed on "no such service" once the network was
      # healed. It was cross-entity anyway (this stack smoke-testing devclaw
      # against OpenClaw's env file); if revived, it belongs in devclaw's own
      # deploy.yml as a post-deploy step against the `devclaw` project.)
