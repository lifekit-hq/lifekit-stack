name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Pre-commit (gitleaks, yamllint, shellcheck, hadolint, ruff)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs history

      # setup-python@v5 can't provision Python on this arm64 self-hosted runner
      # ("version '3.13' ... not found for Debian 13"). The runner already ships
      # system python3 + python3-venv (installed by bootstrap), so run pre-commit
      # from a throwaway venv instead.
      - name: Run pre-commit
        run: |
          python3 -m venv "$RUNNER_TEMP/pcvenv"
          "$RUNNER_TEMP/pcvenv/bin/pip" install --quiet --upgrade pip pre-commit
          "$RUNNER_TEMP/pcvenv/bin/pre-commit" run --all-files --show-diff-on-failure --color=always

  tests:
    name: Tests (memory-audit, container-exporter)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Same throwaway-venv pattern as the lint job (setup-python can't provision
      # on this arm64 self-hosted runner; system python3 + venv are bootstrapped).
      - name: Run pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/testvenv"
          "$RUNNER_TEMP/testvenv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/testvenv/bin/pip" install --quiet pytest
          "$RUNNER_TEMP/testvenv/bin/python" -m pytest -q scripts/memory-audit/tests compose/container-exporter/tests

  gitleaks-full:
    name: Gitleaks full-history scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
      # org-owned repos (it hard-fails "License key is required" once the repo
      # moved dsdevq -> lifekit-hq). The OSS gitleaks BINARY is MIT-licensed and
      # unaffected, so run it directly — same full-history scan, its exit code is
      # the gate (the action wrapper only added the SARIF upload we already
      # disabled). Pinned to the same rev as the pre-commit gitleaks hook.
      - name: Gitleaks (OSS binary, full history)
        run: |
          VERSION=8.21.2
          case "$(uname -m)" in
            aarch64|arm64) GL_ARCH=arm64 ;;
            x86_64|amd64)  GL_ARCH=x64 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_${GL_ARCH}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact "$GITHUB_WORKSPACE"

  deploy:
    name: Deploy to VPS
    needs: [lint, tests, gitleaks-full]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Deploy
        run: |
          cd /srv/lifekit-stack
          git fetch origin main
          git reset --hard origin/main
          bash scripts/deploy.sh

      - name: Smoke check
        run: |
          cd /srv/lifekit-stack
          docker compose -f compose/docker-compose.yml --env-file /srv/openclaw/config/.env ps \
            --format "table {{.Service}}\t{{.State}}\t{{.Status}}"

      # (The post-deploy devclaw eval smoke was retired 2026-08-16: it targeted
      # the devclaw-mcp service in THIS compose file, which left with spec 005 —
      # every main deploy failed on "no such service" once the network was
      # healed. It was cross-entity anyway (this stack smoke-testing devclaw
      # against OpenClaw's env file); if revived, it belongs in devclaw's own
      # deploy.yml as a post-deploy step against the `devclaw` project.)
